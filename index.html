<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 4.0 - Xác Thực & Dự Đoán</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --bg-color: #020024;
            --text-color: #f0f0f0;
            --border-glow: rgba(0, 229, 255, 0.8);
            --xiu-color: #00e5ff;
            --tai-color: #ffd700;
            --error-color: #ff3860;
        }

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            overflow-x: hidden;
            position: relative;
        }
        
        .galaxy-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: -2;
        }
        #stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat; background-size: 200px 200px;
            animation: zoom-stars 40s linear infinite; z-index: -1;
        }
        @keyframes zoom-stars { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        #clock-container {
            width: 100%; text-align: center; margin-bottom: 20px;
            font-size: 1.2em; color: var(--xiu-color); text-shadow: 0 0 8px var(--xiu-color); z-index: 2;
        }

        .aurora-container {
            position: relative; padding: 3px; border-radius: 23px;
            margin-bottom: 20px; z-index: 2; overflow: hidden;
            width: 100%; max-width: 500px;
        }
        .aurora-container::before {
            content: ''; position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient( transparent, rgba(0, 255, 255, 0.8), rgba(255, 0, 255, 0.8), rgba(255, 255, 0, 0.8), transparent 30% );
            animation: rotate-aurora 6s linear infinite;
        }
        @keyframes rotate-aurora { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .main-container {
            width: 100%; background-color: rgba(13, 2, 33, 0.85);
            border-radius: 20px; padding: 30px; text-align: center;
            backdrop-filter: blur(12px) saturate(180%); -webkit-backdrop-filter: blur(12px) saturate(180%);
            position: relative; z-index: 1; box-sizing: border-box;
        }
        
        h1, h2 {
            font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 0 15px var(--border-glow);
        }
        h1 { font-size: 1.8em; margin: 0 0 25px 0; }
        h2 { font-size: 1.5em; margin: 0 0 15px 0; }
        
        .hidden { display: none; }

        /* --- Section Specific Styles --- */
        .key-input, .custom-input, .game-code-input {
            width: 100%; padding: 15px; font-family: 'Orbitron', sans-serif;
            background-color: rgba(0,0,0,0.4); border: 1px solid var(--border-glow);
            border-radius: 10px; color: var(--text-color); font-size: 1.2em;
            text-align: center; box-sizing: border-box; margin-bottom: 10px; transition: all 0.3s ease;
        }
        .key-input:focus, .custom-input:focus, .game-code-input:focus { outline: none; box-shadow: 0 0 15px var(--border-glow); }
        .key-input.error { border-color: var(--error-color); box-shadow: 0 0 15px var(--error-color); }
        #error-message { color: var(--error-color); min-height: 20px; margin-bottom: 15px; font-size: 0.9em; text-shadow: 0 0 5px var(--error-color); }
        
        .confirm-btn, .enter-btn, .analyze-btn {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            border: none; color: white; padding: 18px 40px; font-family: 'Orbitron', sans-serif;
            font-size: 1.2em; font-weight: 700; border-radius: 50px; cursor: pointer;
            transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 2px;
            position: relative; overflow: hidden; box-shadow: 0 0 20px #dc2743; width: 100%;
        }
        .confirm-btn, .enter-btn { margin-top: 5px; }
        .analyze-btn { margin-top: 20px; }
        .confirm-btn:hover, .enter-btn:hover, .analyze-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 0 30px #bc1888; }
        
        .selection-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
        .provider-btn {
            background: rgba(255,255,255,0.1); border: 1px solid var(--border-glow);
            color: white; padding: 15px; font-family: 'Orbitron', sans-serif;
            font-size: 1.1em; border-radius: 10px; cursor: pointer; transition: all 0.3s ease;
        }
        .provider-btn:hover { background: var(--border-glow); color: #000; transform: translateY(-2px); }

        .prediction-area {
            background: rgba(0,0,0,0.3); border-radius: 15px; padding: 30px;
            min-height: 200px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.1);
            perspective: 1000px; position: relative; overflow: hidden;
        }
        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, var(--xiu-color), transparent);
            box-shadow: 0 0 10px var(--xiu-color); animation: scan 1.5s linear forwards; opacity: 0;
        }
        @keyframes scan { 0% { top: 0; opacity: 1; } 100% { top: 100%; opacity: 0; } }
        #status-text { color: #ccc; min-height: 24px; margin-bottom: 10px; }
        .prediction-text {
            font-size: 7em; font-weight: 900; text-transform: uppercase;
            letter-spacing: 10px; margin: 10px 0 0 0;
            background-image: linear-gradient(90deg, #ff00ae, #b600ff, #00b8ff, #00ff95, #b4ff00, #ffb300, #ff00ae);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: rainbow-flow 2s linear infinite, pop-in 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            opacity: 0;
        }
        .prediction-text.visible { opacity: 1; }
        @keyframes pop-in { 0% { transform: scale(0.5); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        
        #history-list { list-style: none; padding: 0; margin: 0 0 15px 0; max-height: 210px; overflow-y: auto; }
        #history-list li {
            background-color: rgba(0,0,0,0.3); padding: 10px 15px; border-radius: 8px;
            margin-bottom: 8px; display: flex; justify-content: space-between;
            align-items: center; font-family: monospace; font-size: 1.2em;
        }
        #history-list .result-tai { font-weight: bold; color: var(--tai-color); text-shadow: 0 0 5px var(--tai-color); }
        #history-list .result-xiu { font-weight: bold; color: var(--xiu-color); text-shadow: 0 0 5px var(--xiu-color); }
        .clear-btn {
            width: 100%; background: #5a5a5a; border: none; color: #ccc; padding: 10px;
            font-family: 'Orbitron', sans-serif; font-size: 1em; font-weight: 700;
            border-radius: 8px; cursor: pointer; transition: all 0.3s ease;
        }
        .clear-btn:hover { background: #777; color: #fff; }

        .contact-info {
            font-size: 1.1em; letter-spacing: 1px;
        }
        .contact-info a {
            color: var(--text-color); text-decoration: none; display: block;
            margin: 10px 0; transition: color 0.3s ease, transform 0.3s ease;
        }
        .contact-info a:hover { color: var(--xiu-color); transform: scale(1.05); }
        .admin-text {
            font-weight: 900;
            background-image: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #00ff00, #ff00ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-size: 200% auto; animation: rainbow-flow 2s linear infinite;
        }
        @keyframes rainbow-flow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        @media (max-width: 500px) {
            body { padding: 10px; }
            .main-container { padding: 20px; }
            h1 { font-size: 1.5em; }
            h2 { font-size: 1.3em; }
            #clock-container, .contact-info, .key-input, .confirm-btn, .provider-btn, .custom-input, .enter-btn, .clear-btn { font-size: 1em; }
            .prediction-text { font-size: 4.5em; }
            #history-list li { font-size: 1em; }
        }
    </style>
</head>
<body>
    <div class="galaxy-background"></div>
    <div id="stars"></div>
    <div id="clock-container"></div>

    <div id="key-page">
        <div class="aurora-container">
            <div class="main-container">
                <h1>KÍCH HOẠT TOOL</h1>
                <input type="text" id="key-input" class="key-input" placeholder="Nhập Key Kích Hoạt">
                <p id="error-message"></p>
                <button id="confirm-btn" class="confirm-btn">Xác Nhận</button>
            </div>
        </div>
    </div>
    
    <div id="provider-page" class="hidden">
         <div class="aurora-container">
            <div class="main-container">
                <h1>CỔNG CHỌN NHÀ CÁI</h1>
                <div class="selection-grid">
                    <button class="provider-btn" data-provider="GO88">GO88</button>
                    <button class="provider-btn" data-provider="HITCLUB">HITCLUB</button>
                    <button class="provider-btn" data-provider="SUNWIN">SUNWIN</button>
                    <button class="provider-btn" data-provider="B52">B52</button>
                </div>
                <input type="text" id="custom-provider-input" class="custom-input" placeholder="Hoặc nhập tên nhà cái khác">
                <button id="enter-btn" class="enter-btn">Vào Tool</button>
            </div>
        </div>
    </div>

    <div id="tool-page" class="hidden">
        <div class="aurora-container">
            <div class="main-container">
                <h1 id="tool-title">AI PREDICTOR</h1>
                <div class="input-area">
                     <label for="game-code-input">Nhập mã ván (7 số)</label>
                     <input type="text" id="game-code-input" class="game-code-input" placeholder="_ _ _ _ _ _ _" maxlength="7">
                </div>
                <div id="prediction-area" class="prediction-area">
                    <p id="status-text">Chờ lệnh phân tích...</p>
                    <p id="prediction-text" class="prediction-text"></p>
                </div>
                <button id="analyze-btn" class="analyze-btn">Phân Tích</button>
            </div>
        </div>
        <div class="aurora-container">
             <div class="main-container">
                <h2>Lịch sử phân tích</h2>
                <ul id="history-list"></ul>
                <button id="clear-history-btn" class="clear-btn">Xóa Lịch Sử</button>
            </div>
        </div>
    </div>

    <div class="aurora-container">
        <div class="main-container contact-info">
             <a href="https://t.me/rice7788" target="_blank">TELEGRAM : t.me/rice7788</a>
             <a href="https://www.facebook.com/quan.pham.948838" target="_blank">
                  <span class="admin-text">ADMIN</span> : LIÊN HỆ
             </a>
        </div>
    </div>

    <script>
        // --- Common Elements ---
        const clockContainer = document.getElementById('clock-container');
        
        // --- Page Containers ---
        const keyPage = document.getElementById('key-page');
        const providerPage = document.getElementById('provider-page');
        const toolPage = document.getElementById('tool-page');

        // --- Key Page Elements ---
        const keyInput = document.getElementById('key-input');
        const confirmBtn = document.getElementById('confirm-btn');
        const errorMessage = document.getElementById('error-message');
        const CORRECT_KEY = "toolquanpham30day"; // <<<=== KEY ĐÃ ĐƯỢC THAY ĐỔI Ở ĐÂY

        // --- Provider Page Elements ---
        const customProviderInput = document.getElementById('custom-provider-input');
        const providerButtons = document.querySelectorAll('.provider-btn');
        const enterBtn = document.getElementById('enter-btn');

        // --- Tool Page Elements ---
        const toolTitle = document.getElementById('tool-title');
        const gameCodeInput = document.getElementById('game-code-input');
        const analyzeBtn = document.getElementById('analyze-btn');
        let predictionText = document.getElementById('prediction-text');
        const predictionArea = document.getElementById('prediction-area');
        const statusText = document.getElementById('status-text');
        const historyList = document.getElementById('history-list');
        const clearHistoryBtn = document.getElementById('clear-history-btn');

        let history = [];
        const HISTORY_STORAGE_KEY = 'tai_xiu_history_combined';

        // --- Sound Effects ---
        let soundsReady = false;
        const clickSynth = new Tone.MembraneSynth().toDestination();
        const successSynth = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "fatsawtooth" }, envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.3 } }).toDestination();
        const analyzingSynth = new Tone.AMSynth({ harmonicity: 1.5, envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.1 }, modulation: { type: "square" }, modulationEnvelope: { attack: 0.01, decay: 0.2, sustain: 0.2, release: 0.2 } }).toDestination();
        const startAudio = () => { if (Tone.context.state !== 'running') { Tone.context.resume(); } soundsReady = true; document.body.removeEventListener('click', startAudio); };
        document.body.addEventListener('click', startAudio);

        // --- Common Functions ---
        const updateClock = () => {
            const now = new Date();
            const options = { timeZone: 'Asia/Ho_Chi_Minh', hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            const formatter = new Intl.DateTimeFormat('vi-VN', options);
            const parts = formatter.formatToParts(now).reduce((acc, part) => ({ ...acc, [part.type]: part.value }), {});
            clockContainer.textContent = `Giờ VN: ${parts.hour}:${parts.minute}:${parts.second} - ${parts.day}/${parts.month}/${parts.year}`;
        };

        // --- Page Switching Logic ---
        function showPage(pageToShow) {
            keyPage.classList.add('hidden');
            providerPage.classList.add('hidden');
            toolPage.classList.add('hidden');
            pageToShow.classList.remove('hidden');
        }

        // --- Key Page Logic ---
        confirmBtn.addEventListener('click', () => {
            if (!soundsReady) startAudio();
            clickSynth.triggerAttackRelease("C2", "8n", Tone.now());
            const enteredKey = keyInput.value.trim();
            if (enteredKey === CORRECT_KEY) {
                errorMessage.textContent = "";
                keyInput.classList.remove('error');
                showPage(providerPage);
            } else {
                errorMessage.textContent = "Key không chính xác! Vui lòng thử lại.";
                keyInput.classList.add('error');
            }
        });

        // --- Provider Page Logic ---
        providerButtons.forEach(button => {
            button.addEventListener('click', () => {
                if (!soundsReady) startAudio();
                clickSynth.triggerAttackRelease("C3", "8n", Tone.now());
                customProviderInput.value = button.getAttribute('data-provider');
            });
        });

        enterBtn.addEventListener('click', () => {
            if (!soundsReady) startAudio();
            clickSynth.triggerAttackRelease("C4", "8n", Tone.now());
            const provider = customProviderInput.value.trim();
            if (provider) {
                toolTitle.textContent = `AI PREDICTOR - ${provider.toUpperCase()}`;
                showPage(toolPage);
            } else {
                alert('Vui lòng chọn hoặc nhập một nhà cái!');
            }
        });

        // --- Tool Page Logic ---
        const saveHistory = () => localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(history));
        const renderHistory = () => {
            historyList.innerHTML = history.map(item => `<li class="${item.result === 'TÀI' ? 'result-tai' : 'result-xiu'}"><span>Mã: ${item.code}</span><span>${item.result}</span></li>`).join('');
        };
        const loadHistory = () => { const saved = localStorage.getItem(HISTORY_STORAGE_KEY); if (saved) { history = JSON.parse(saved); renderHistory(); } };
        
        gameCodeInput.addEventListener('input', (e) => e.target.value = e.target.value.replace(/[^0-9]/g, ''));

        analyzeBtn.addEventListener('click', () => {
            if (!soundsReady) startAudio();
            clickSynth.triggerAttackRelease("C2", "8n", Tone.now());
            const code = gameCodeInput.value;
            if (code.length !== 7) {
                statusText.textContent = 'Lỗi: Vui lòng nhập ĐỦ 7 số!';
                predictionText.classList.remove('visible');
                return;
            }

            analyzeBtn.disabled = true;
            predictionText.classList.remove('visible');
            statusText.textContent = 'Đang phân tích...';

            const scanLine = document.createElement('div');
            scanLine.className = 'scan-line';
            predictionArea.appendChild(scanLine);
            setTimeout(() => scanLine.remove(), 1500);

            analyzingSynth.triggerAttackRelease("C3", "32n", Tone.now() + 0.1);
            analyzingSynth.triggerAttackRelease("G3", "32n", Tone.now() + 0.3);
            analyzingSynth.triggerAttackRelease("C4", "32n", Tone.now() + 0.5);
            
            setTimeout(() => {
                const lastDigit = parseInt(code.slice(-1));
                let result = (lastDigit % 2 === 0) ? 'TÀI' : 'XỈU';
                
                statusText.textContent = `Phân tích hoàn tất!`;
                predictionText.textContent = result;
                predictionText.classList.add('visible');

                successSynth.triggerAttackRelease(result === 'TÀI' ? ["C4", "E4", "G4"] : ["C4", "D#4", "G4"], "8n", Tone.now());
                gameCodeInput.value = '';

                history.unshift({ code, result });
                if (history.length > 20) history.pop();
                saveHistory();
                renderHistory();

                analyzeBtn.disabled = false;
            }, 1500);
        });

        clearHistoryBtn.addEventListener('click', () => {
            if (!soundsReady) return;
            clickSynth.triggerAttackRelease("C1", "8n");
            history = [];
            saveHistory();
            renderHistory();
        });

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            loadHistory();
            updateClock();
            setInterval(updateClock, 1000);
        });
    </script>
</body>
</html>
